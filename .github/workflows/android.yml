name: Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    env:
      GO_VERSION: "1.25.6"
      WAILS_VERSION: "v3.0.0-beta.27"
      ANDROID_API_LEVEL: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "26.3.11579264"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          wails3 version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          yes | sdkmanager --licenses || true

      - name: Set Android environment
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          java -version
          go version
          node --version
          npm --version

          echo "Android SDK:"
          sdkmanager --version

          echo "Android NDK:"
          test -d "$ANDROID_NDK_HOME"
          ls -la "$ANDROID_NDK_HOME"

          echo "Wails:"
          wails3 version

          echo "Wails Doctor:"
          wails3 doctor

      - name: Install frontend dependencies
        run: |
          if [ -f frontend/package-lock.json ]; then
            cd frontend
            npm ci
          elif [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json found"
            exit 1
          fi

      - name: Build Android APK
        run: |
          wails3 task android:package

      - name: Find APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TarotOracleApp-Android-APK
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 14
