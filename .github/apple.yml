# Сборка для Apple: macOS (приложение) и iOS (симулятор).
# Запускается вручную (Actions → Apple build → Run workflow)
# или при пуше тега вида v1.0.0. На каждый коммит не запускается —
# минуты macOS-раннеров расходуются быстрее обычных.
 
name: Apple build
 
on:
  workflow_dispatch:
    inputs:
      universal:
        description: "macOS: универсальная сборка (Apple Silicon + Intel)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"
 
env:
  # та же версия, что в go.mod проекта
  WAILS_VERSION: v3.0.0-beta.27
 
jobs:
  # ------------------------------------------------------------
  # macOS: .app (без подписи)
  # ------------------------------------------------------------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
 
      - uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Установить Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
 
      - name: Проверка окружения
        run: wails3 doctor
        continue-on-error: true
 
      - name: Собрать .app
        run: |
          if [ "${{ inputs.universal }}" = "true" ]; then
            wails3 task darwin:package:universal
          else
            wails3 package
          fi
 
      - name: Упаковать .app в zip
        run: |
          APP=$(find bin -maxdepth 1 -type d -name '*.app' | head -n1)
          echo "Найдено: $APP"
          test -n "$APP"
          # ditto сохраняет структуру пакета .app (обычный zip её портит)
          ditto -c -k --keepParent "$APP" tarot-oracle-macos.zip
 
      - uses: actions/upload-artifact@v4
        with:
          name: tarot-oracle-macos
          path: tarot-oracle-macos.zip
 
  # ------------------------------------------------------------
  # iOS: сборка под симулятор (без подписи и аккаунта Apple).
  # Поддержка iOS в Wails v3 пока молодая — если эта задача упадёт,
  # macOS-сборка выше всё равно будет собрана.
  # ------------------------------------------------------------
  ios-simulator:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
 
      - uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Установить Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
 
      - name: Проверка окружения (видны ли iOS SDK)
        run: wails3 doctor
        continue-on-error: true
 
      - name: Собрать .app для симулятора
        run: wails3 task ios:package
 
      - name: Упаковать .app в zip
        run: |
          APP=$(find bin build -maxdepth 4 -type d -name '*.app' 2>/dev/null | head -n1)
          echo "Найдено: $APP"
          test -n "$APP"
          ditto -c -k --keepParent "$APP" tarot-oracle-ios-simulator.zip
 
      - uses: actions/upload-artifact@v4
        with:
          name: tarot-oracle-ios-simulator
          path: tarot-oracle-ios-simulator.zip
 
# ------------------------------------------------------------
# Позже, когда будет аккаунт Apple Developer, сюда добавится:
#  - подпись macOS (Developer ID) и нотаризация;
#  - iOS .ipa для телефона:
#      wails3 task ios:package:ipa IOS_PLATFORM=device \
#        CODESIGN_IDENTITY="..." PROVISIONING_PROFILE=...
#    Сертификат (.p12) и provisioning-профиль хранятся в Secrets
#    репозитория и импортируются в временную связку ключей на раннере.
# ------------------------------------------------------------
 